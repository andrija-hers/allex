[package]
name = "allex-postgres"
description = "Pooled Postgres access (deadpool) with a FromRow derive for allex services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["allex", "postgres", "deadpool"]

[lib]
name = "allex_postgres"
path = "./lib.rs"

[dependencies]
allex-postgres-macros = { path = "../postgres-macros", version = "0.1.0" }
deadpool = "0.10"
deadpool-postgres = { version = "0.11", features = ["rt_tokio_1"] }
tokio-postgres = "0.7"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
