[package]
name = "allex-winsvc"
description = "Thin Windows-service host harness for allex backends (Windows-only; an empty crate elsewhere so it can be depended on unconditionally)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["allex", "windows", "service"]

[package.metadata.docs.rs]
# Windows-only crate; build its docs on the Windows target so they aren't empty.
default-target = "x86_64-pc-windows-msvc"
targets = []

[lib]
name = "allex_winsvc"
path = "./lib.rs"

# A thin, reusable Windows-service host harness. Windows-only; the crate is empty elsewhere so it can
# sit in a cross-platform workspace and be depended on unconditionally.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
tokio = { version = "1", features = ["sync"] }
