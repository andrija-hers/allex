[package]
name = "allex-identity"
description = "IdentityV1 service, JWT token engine, and pluggable credential/account store seams (login, refresh, sessions, registration guard) for allex."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["allex", "identity", "auth", "jwt"]

[lib]
path = "./lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
futures = "0.3"
async-trait = "0.1"
jsonwebtoken = "9"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4"] }
message_templates = { path = "../message-templates", package = "allex-message-templates" }
transport = { path = "../transport", package = "allex-transport" }
rpc-macro = { path = "../rpc-macro", package = "allex-rpc-macros" }
execution = { path = "../execution", package = "allex-execution" }
progressable-future = { path = "../progressable-future", package = "allex-progressable-future" }
