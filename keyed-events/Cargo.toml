[package]
name = "allex-keyed-events"
description = "Per-key broadcast hub, Postgres LISTEN/NOTIFY driver, and replay-and-watch combinator for cross-instance live event streams in allex."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["allex", "events", "postgres", "notify"]

[lib]
name = "allex_keyed_events"
path = "./lib.rs"

[dependencies]
tokio = { version = "1", features = ["sync", "rt", "time"] }
tokio-postgres = "0.7"
futures = "0.3"
progressable-future = { path = "../progressable-future", package = "allex-progressable-future" }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "rt-multi-thread"] }
