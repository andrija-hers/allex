[workspace]
resolver = "3"
members = [
    "rpc-macro",
    "transport",
    "progressable-future",
    "execution",
    "message-templates",
    "mailgunner",
    "identity",
    "identity-sqlite",
    "postgres-macros",
    "postgres",
    "identity-postgres",
    "identity-redb",
    "examples/arithmetic_base",
    "examples/arithmetic_client",
    "examples/arithmetic_server",
    "watch-singleton",
    "awaitable-map",
    "examples/arithmetic_tests",
