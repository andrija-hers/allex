[package]
name = "allex-execution"
description = "Registry and dispatch traits (unary and streaming) that route allex RPC method calls to their handlers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["allex", "rpc", "dispatch"]

[lib]
path = "./lib.rs"

[dependencies]
async-trait = "0.1.89"
dashmap = "6.2.1"
futures = "0.3"
transport = { version = "0.1.0", path = "../transport", package = "allex-transport" }
