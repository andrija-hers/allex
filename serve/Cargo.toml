[package]
name = "allex-serve"
description = "Transport-agnostic request dispatch loop plus the per-request caller context (handle/role/profile) for allex services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["allex", "rpc", "serve"]

[lib]
name = "allex_serve"
path = "./lib.rs"

[dependencies]
execution = { version = "0.1.0", path = "../execution", package = "allex-execution" }
transport = { version = "0.1.0", path = "../transport", package = "allex-transport" }
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros"] }
