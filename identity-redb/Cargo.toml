[package]
name = "allex-identity-redb"
description = "redb-backed identity store for allex: bcrypt credentials, sessions, and bearer-token validation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["allex", "identity", "redb", "auth"]

[lib]
name = "allex_identity_redb"
path = "./src/lib.rs"

[dependencies]
identity = { path = "../identity", package = "allex-identity" }
message_templates = { path = "../message-templates", package = "allex-message-templates" }
transport = { path = "../transport", package = "allex-transport" }
bcrypt = "0.15"
jsonwebtoken = "9"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
