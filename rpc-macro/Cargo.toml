[package]
name = "allex-rpc-macros"
description = "Proc-macro turning a `#[rpc_module]` trait into a typed client, server responder, and permission helpers for allex RPC services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["allex", "rpc", "macro", "codegen"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
