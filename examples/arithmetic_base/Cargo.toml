[package]
name = "arithmetic-base"
publish = false
version = "0.1.0"
edition = "2024"

[lib]
path = "./lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
tokio-stream = "0.1"
axum = "0.8"
transport = { path = "../../transport", package = "allex-transport" }
execution = { path = "../../execution", package = "allex-execution" }
progressable-future = { path = "../../progressable-future", package = "allex-progressable-future" }
rpc-macro = { path = "../../rpc-macro", package = "allex-rpc-macros" }
