[package]
name = "arithmetic_server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "arithmetic_server"
path = "./main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tokio-stream = "0.1"
axum = "0.8"
transport = {path = "../../transport", package = "allex-transport"}
execution = { path = "../../execution", package = "allex-execution" }
arithmetic-base = {path = "../arithmetic_base"}
progressable-future = { path = "../../progressable-future", package = "allex-progressable-future" }

[[bin]]
name = "arithmetic-websocket-server"
path = "./websocket_main.rs"
