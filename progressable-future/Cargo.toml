[package]
name = "allex-progressable-future"
description = "ProgressableFuture: a future that emits progress updates before completing; substrate for allex streaming RPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["allex", "future", "streaming", "async"]

[package.metadata.docs.rs]
# Document all feature-gated items (default = std; also alloc).
all-features = true

[lib]
name = "progressable_future"

# default uses std/tokio for ergonomics
[features]
default = ["std"]
std = ["tokio", "futures"]
alloc = [] # enabling `alloc` allows building for no_std + alloc

[dependencies]
# tokio & futures only enabled when `std` feature is on
tokio = { version = "1", optional = true, features = ["full"] }
futures = { version = "0.3", optional = true }

# For no_std/alloc builds, rely on alloc crate from rust runtime
# (no dependency needed, but we conditionally use `alloc` in code)
