[package]
name = "allex-identity-postgres"
description = "Postgres-backed identity store for allex: bcrypt credentials, sessions, and bearer-token validation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["allex", "identity", "postgres", "auth"]

[lib]
name = "allex_identity_postgres"
path = "./lib.rs"

[dependencies]
allex-postgres = { path = "../postgres", version = "0.1.0" }
identity = { path = "../identity", package = "allex-identity" }
message_templates = { path = "../message-templates", package = "allex-message-templates" }
transport = { path = "../transport", package = "allex-transport" }
bcrypt = "0.15"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
