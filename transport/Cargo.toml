[package]
name = "allex-transport"
description = "Wire types, codecs, and transports (axum, reqwest, websocket, signalr) for allex RPC, with the error-to-HTTP-status mapping and bearer-token seam."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["allex", "rpc", "transport", "axum"]

[lib]
path = "./lib.rs"

[dependencies]
progressable-future = { path = "../progressable-future", package = "allex-progressable-future", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
tokio-stream = "0.1"
axum = { version = "0.8", features = ["ws"] }
async-stream = "0.3"
tokio-tungstenite = "0.28"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
