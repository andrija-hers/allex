[package]
name = "allex-transport"
version = "0.1.0"
edition = "2024"

[lib]
path = "./lib.rs"

[dependencies]
progressable-future = { path = "../progressable-future", package = "allex-progressable-future" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
tokio-stream = "0.1"
axum = { version = "0.8", features = ["ws"] }
async-stream = "0.3"
tokio-tungstenite = "0.28"
uuid = { version = "1", features = ["v4"] }
