[package]
name = "allex-host"
description = "Batteries-included axum host builder (ServiceHost) wiring registry, transport, and dispatch, plus startup bootstrap helpers, for allex backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["allex", "rpc", "axum", "host"]

[lib]
name = "allex_host"
path = "./lib.rs"

[dependencies]
execution = { version = "0.1.0", path = "../execution", package = "allex-execution" }
transport = { version = "0.1.0", path = "../transport", package = "allex-transport" }
serve = { version = "0.1.0", path = "../serve", package = "allex-serve" }
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "macros"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.7.0", features = ["compression-gzip"] }

[dev-dependencies]
async-trait = "0.1.89"
