[package]
name = "allex-state"
version = "0.1.0"
edition = "2024"

[lib]
path = "./lib.rs"

[dependencies]
allex-state-macro = { path = "../state-macro" }
progressable-future = { path = "../progressable-future", package = "allex-progressable-future" }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
