[package]
name = "allex-awaitable-map"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Keyed awaitable fetch-coalescing cache: single-flight dedup, pluggable (SQLite) persistence, failure cooldown, progress streaming."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3"
progressable-future = { path = "../progressable-future", package = "allex-progressable-future" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
