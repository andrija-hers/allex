[package]
name = "allex-awaitable-map"
description = "Keyed awaitable fetch-coalescing cache: single-flight dedup, pluggable (SQLite) persistence, failure cooldown, progress streaming."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["allex", "cache", "single-flight"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3"
progressable-future = { path = "../progressable-future", package = "allex-progressable-future" }
rusqlite = { version = "0.32", features = ["bundled"] }
# `rc` enables Serialize/DeserializeOwned for Arc<T>/Rc<T>, so callers can use a
# shared value type (e.g. Arc<DataRow>) with the SQLite-backed persistence.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
